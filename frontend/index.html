<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login usuario</title>
</head>
<body>
    <main>
        <div>
            <h1>Tela de Login</h1>
            <input type="email" placeholder="seuemail@email.com" id="login">
            <input type="password" placeholder="********" id="senha">
            <button type="button" onclick="meuEmail()">Entrar</button> 
        </div>

        <h1>Não tem conta?</h1>
        <button onclick="chamarCadastro()">Clique Aqui</button>
        <div id="cadastramentoDiv" style="display: none;">
            <input type="text" placeholder="Digite seu nome completo" id="nomeCadastrado">
            <input type="email" placeholder="Digite seu email" id="emailCadastro">
            <input type="password" placeholder="Digite sua senha" id="senhaCadastrada">
            <button type="button" onclick="cadastrarDados()">Enviar</button>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
